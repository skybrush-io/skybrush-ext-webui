[version]
current = "1.0.1"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[git]
message_template = "chore: bumped version to {new_version}"
tag_template = "{new_version}"

[[file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[before_commit]]
name = "Run pre-commit hooks"
cmd = "uv sync && prek run --all-files"

# Pushing the tag triggers the CI workflow in .github/workflows/ci.yml, which
# builds the frontend and the Python package and publishes it to Gemfury
