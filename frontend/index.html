<!doctype html>
<!--
  Used only by the Vite development server. In production, the page is
  rendered by the server from templates/app.html.j2; keep the two in sync.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skybrush Server</title>
    <base href="/webui/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      try {
        var theme = localStorage.getItem('skybrush-webui-theme')
        if (
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
